<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>우리 가족 추억 갤러리</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* 가로 스크롤바 숨기기 (터치 슬라이드 최적화) */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    /* 뷰어 이미지 터치 제스처 허용 */
    .zoom-img { transition: transform 0.15s ease-out; touch-action: none; }
  </style>
</head>
<body class="bg-[#F8F9FA] text-stone-800 min-h-screen select-none">

  <!-- 1. 고정 상단 네비게이션 헤더 -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-stone-200 px-4 py-3 shadow-sm">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div>
        <h1 class="text-lg md:text-xl font-extrabold text-stone-900 tracking-tight">가족의 계절, 우리의 시간</h1>
        <p class="text-[11px] text-stone-400">사진을 누르면 크게 볼 수 있습니다</p>
      </div>
      <span id="header-badge" class="text-xs bg-amber-50 text-amber-800 border border-amber-200 px-3 py-1 rounded-full font-semibold"></span>
    </div>

    <!-- 연도 칩 바 (가로 스크롤 슬라이드, 드롭다운 없음) -->
    <div class="max-w-6xl mx-auto mt-3 flex gap-2 overflow-x-auto no-scrollbar pb-1" id="year-chips"></div>

    <!-- 이벤트 칩 바 (선택된 연도의 하위 이벤트 목록) -->
    <div class="max-w-6xl mx-auto mt-2 flex gap-2 overflow-x-auto no-scrollbar pb-1" id="event-chips"></div>
  </header>

  <!-- 2. 메인 사진 영역 -->
  <main class="max-w-6xl mx-auto p-3 md:p-6">
    <!-- 이벤트 타이틀 및 AI 설명 카드 -->
    <div class="mb-4 bg-white p-4 md:p-5 rounded-2xl border border-stone-200 shadow-sm">
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
        <h2 class="text-base md:text-xl font-bold text-stone-900 tracking-tight" id="event-title">추억을 불러오는 중...</h2>
      </div>
      <p class="text-xs md:text-sm text-stone-500 mt-1.5 pl-4" id="event-desc"></p>
    </div>

    <!-- 사진 그리드 (모바일 3열 컴팩트 뷰, PC 5열 정렬) -->
    <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-1.5 md:gap-3" id="photo-grid"></div>
  </main>

  <!-- 3. 전체화면 전용 뷰어 (확대/축소 및 뒤로가기) -->
  <div id="viewer-modal" class="fixed inset-0 z-50 bg-black hidden flex flex-col justify-between">
    <!-- 상단 툴바 -->
    <div class="p-4 flex items-center justify-between text-white z-10 bg-gradient-to-b from-black/80 to-transparent">
      <!-- 뒤로가기 버튼 -->
      <button onclick="closeViewer()" class="flex items-center gap-2 bg-white/20 hover:bg-white/30 active:scale-95 px-4 py-2 rounded-full text-sm font-semibold backdrop-blur transition">
        <i class="fa-solid fa-arrow-left"></i>
        <span>뒤로가기</span>
      </button>

      <!-- 줌 조절 버튼 -->
      <div class="flex items-center gap-1.5 bg-white/20 backdrop-blur px-2 py-1 rounded-full text-xs">
        <button onclick="zoomStep(-0.3)" class="w-7 h-7 flex items-center justify-center rounded-full hover:bg-white/20 active:scale-90"><i class="fa-solid fa-minus"></i></button>
        <button onclick="resetZoom()" class="px-2 py-1 hover:bg-white/20 rounded-md">100%</button>
        <button onclick="zoomStep(0.3)" class="w-7 h-7 flex items-center justify-center rounded-full hover:bg-white/20 active:scale-90"><i class="fa-solid fa-plus"></i></button>
      </div>
    </div>

    <!-- 사진 표시 영역 (더블탭 확대 및 드래그/핀치 줌) -->
    <div class="flex-1 flex items-center justify-center overflow-hidden p-2 relative" id="img-container">
      <img id="viewer-img" src="" class="zoom-img max-h-full max-w-full object-contain cursor-grab active:cursor-grabbing" alt="확대 사진">
    </div>

    <!-- 하단 도움말 바 -->
    <div class="p-3 text-center text-[11px] text-white/60 bg-gradient-to-t from-black/80 to-transparent">
      화면을 두 번 연속 터치하면 확대되며, 좌측 상단 [뒤로가기]를 누르면 목록으로 돌아갑니다
    </div>
  </div>

  <!-- data.js 연동 -->
  <script src="data.js"></script>

  <script>
    let currentYIdx = 0;
    let currentMIdx = 0;
    let scale = 1;
    let panX = 0, panY = 0;
    let startX = 0, startY = 0;
    let isDragging = false;
    let initialDistance = null;

    function init() {
      if (typeof GALLERY_DATA === 'undefined' || !GALLERY_DATA.length) {
        document.getElementById('event-title').innerText = 'data.js를 읽어오지 못했습니다.';
        return;
      }
      renderYears();
      selectYear(0);
    }

    // 연도 칩 렌더링
    function renderYears() {
      const el = document.getElementById('year-chips');
      el.innerHTML = '';
      GALLERY_DATA.forEach((item, idx) => {
        const btn = document.createElement('button');
        btn.id = `y-btn-${idx}`;
        btn.className = `px-4 py-1.5 rounded-full text-xs md:text-sm font-bold whitespace-nowrap transition active:scale-95 ${
          idx === 0 ? 'bg-stone-900 text-white shadow' : 'bg-stone-100 text-stone-600 hover:bg-stone-200'
        }`;
        btn.innerText = `${item.year}년`;
        btn.onclick = () => selectYear(idx);
        el.appendChild(btn);
      });
    }

    function selectYear(yIdx) {
      currentYIdx = yIdx;
      GALLERY_DATA.forEach((_, idx) => {
        const b = document.getElementById(`y-btn-${idx}`);
        if (b) b.className = `px-4 py-1.5 rounded-full text-xs md:text-sm font-bold whitespace-nowrap transition active:scale-95 ${
          idx === yIdx ? 'bg-stone-900 text-white shadow' : 'bg-stone-100 text-stone-600 hover:bg-stone-200'
        }`;
      });
      renderEvents(yIdx);
      selectEvent(0);
    }

    // 이벤트 칩 렌더링
    function renderEvents(yIdx) {
      const el = document.getElementById('event-chips');
      el.innerHTML = '';
      const months = GALLERY_DATA[yIdx].months;

      months.forEach((m, idx) => {
        const btn = document.createElement('button');
        btn.id = `e-btn-${idx}`;
        btn.className = `px-3.5 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap transition border active:scale-95 ${
          idx === 0 ? 'bg-amber-600 border-amber-600 text-white shadow-sm' : 'bg-white border-stone-200 text-stone-600 hover:bg-stone-50'
        }`;
        btn.innerText = `${m.title} (${m.month})`;
        btn.onclick = () => selectEvent(idx);
        el.appendChild(btn);
      });
    }

    function selectEvent(mIdx) {
      currentMIdx = mIdx;
      const data = GALLERY_DATA[currentYIdx].months[mIdx];

      GALLERY_DATA[currentYIdx].months.forEach((_, idx) => {
        const b = document.getElementById(`e-btn-${idx}`);
        if (b) b.className = `px-3.5 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap transition border active:scale-95 ${
          idx === mIdx ? 'bg-amber-600 border-amber-600 text-white shadow-sm' : 'bg-white border-stone-200 text-stone-600 hover:bg-stone-50'
        }`;
      });

      document.getElementById('event-title').innerText = data.title;
      document.getElementById('event-desc').innerText = `${data.desc} · 총 ${data.photos.length}장`;
      document.getElementById('header-badge').innerText = `${data.photos.length}장의 사진`;

      const grid = document.getElementById('photo-grid');
      grid.innerHTML = data.photos.map(p => `
        <div class="aspect-square bg-stone-200 rounded-lg md:rounded-xl overflow-hidden shadow-sm active:scale-95 cursor-pointer relative group" onclick="openViewer('${p.url}')">
          <img src="${p.url}" alt="${p.name}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
        </div>
      `).join('');
    }

    // 뷰어 제어 로직
    const modal = document.getElementById('viewer-modal');
    const vImg = document.getElementById('viewer-img');

    function openViewer(url) {
      resetZoom();
      vImg.src = url;
      modal.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
      // 브라우저 뒤로가기 버튼(히스토리) 대응
      history.pushState({ viewerOpen: true }, '');
    }

    function closeViewer() {
      modal.classList.add('hidden');
      vImg.src = '';
      document.body.style.overflow = '';
      resetZoom();
      if (history.state && history.state.viewerOpen) {
        history.back();
      }
    }

    // 브라우저 자체 '뒤로가기' 키나 제스처 시 모달 닫기
    window.onpopstate = function() {
      if (!modal.classList.contains('hidden')) {
        modal.classList.add('hidden');
        vImg.src = '';
        document.body.style.overflow = '';
      }
    };

    function updateTransform() {
      vImg.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    function zoomStep(val) {
      scale = Math.min(Math.max(1, scale + val), 4);
      if (scale === 1) { panX = 0; panY = 0; }
      updateTransform();
    }

    function resetZoom() {
      scale = 1;
      panX = 0;
      panY = 0;
      updateTransform();
    }

    // 더블 탭 확대
    let lastTouchTime = 0;
    vImg.addEventListener('touchend', (e) => {
      const now = Date.now();
      if (now - lastTouchTime < 300) {
        scale = scale > 1 ? 1 : 2.2;
        panX = 0; panY = 0;
        updateTransform();
      }
      lastTouchTime = now;
    });

    // 드래그 및 핀치 줌 처리
    const container = document.getElementById('img-container');
    
    container.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        initialDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
      } else if (e.touches.length === 1 && scale > 1) {
        isDragging = true;
        startX = e.touches[0].clientX - panX;
        startY = e.touches[0].clientY - panY;
      }
    });

    container.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && initialDistance) {
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const factor = dist / initialDistance;
        scale = Math.min(Math.max(1, scale * factor), 4);
        initialDistance = dist;
        updateTransform();
      } else if (e.touches.length === 1 && isDragging) {
        panX = e.touches[0].clientX - startX;
        panY = e.touches[0].clientY - startY;
        updateTransform();
      }
    });

    container.addEventListener('touchend', () => {
      isDragging = false;
      initialDistance = null;
      if (scale <= 1) { panX = 0; panY = 0; updateTransform(); }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !modal.classList.contains('hidden')) {
        closeViewer();
      }
    });

    window.onload = init;
  </script>
</body>
</html>
