111<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
  <title>우리 가족 추억보관소</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    document.write('<script src="data.js?v=' + Date.now() + '"><\/script>');
  </script>
  <style>
    ::-webkit-scrollbar { height: 6px; width: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .slider-touch::-webkit-scrollbar { height: 4px; }
    .slider-touch::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    .touch-pan { touch-action: pan-y pinch-zoom; }
  </style>
</head>
<body class="bg-[#FDFBF7] text-stone-800 antialiased selection:bg-amber-100 min-h-screen">

  <!-- 가족 전용 PIN 인증 게이트웨이 -->
  <div id="pin-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-[#FDFBF7] px-4">
    <div class="w-full max-w-sm rounded-3xl bg-white p-8 text-center shadow-xl border border-stone-200">
      <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-amber-50 text-amber-600 mb-4 shadow-sm">
        <i data-lucide="lock" class="h-7 w-7"></i>
      </div>
      <h2 class="text-xl font-bold text-stone-900 font-serif">가족 인증</h2>
      <p class="mt-1 text-xs text-stone-500">우리 가족 전용 비밀번호를 입력해주세요.</p>
      
      <form onsubmit="verifyPin(event)" class="mt-6 space-y-4">
        <input 
          type="password" 
          id="pin-input" 
          maxlength="8" 
          inputmode="numeric" 
          placeholder="PIN 번호 입력" 
          class="w-full tracking-widest text-center text-xl font-bold py-3 px-4 rounded-xl border border-stone-300 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition"
          autofocus
        />
        <p id="pin-error" class="text-xs text-rose-500 hidden font-medium">비밀번호가 올바르지 않습니다.</p>
        <button 
          type="submit" 
          class="w-full py-3 rounded-xl bg-stone-900 text-white text-sm font-semibold hover:bg-amber-600 transition shadow-md active:scale-95"
        >
          추억보관소 들어가기
        </button>
      </form>
    </div>
  </div>

  <!-- 메인 웹페이지 영역 -->
  <div id="main-app" class="hidden">
    <header class="sticky top-0 z-40 flex items-center justify-between border-b border-stone-200/80 bg-[#FDFBF7]/90 px-4 py-3 backdrop-blur-md md:px-8">
      <div>
        <h1 class="text-xl font-bold tracking-tight text-stone-900 md:text-2xl font-serif">
          우리 가족 추억보관소
        </h1>
        <p class="text-xs text-stone-500 hidden sm:block">함께 걸어온 소중한 시간과 이야기</p>
      </div>

      <div class="flex rounded-full bg-stone-200/80 p-1 text-xs md:text-sm font-medium">
        <button id="btn-timeline" onclick="switchView('timeline')" class="flex items-center gap-1.5 rounded-full px-3.5 py-1.5 bg-white text-stone-900 shadow-sm transition">
          <i data-lucide="clock" class="w-4 h-4"></i>
          <span>타임라인</span>
        </button>
        <button id="btn-map" onclick="switchView('map')" class="flex items-center gap-1.5 rounded-full px-3.5 py-1.5 text-stone-600 hover:text-stone-900 transition">
          <i data-lucide="map" class="w-4 h-4"></i>
          <span>지도 여행</span>
        </button>
      </div>
    </header>

    <main class="mx-auto max-w-5xl px-4 py-6 md:px-8">
      <!-- 1. 타임라인 뷰 -->
      <section id="timeline-view" class="flex flex-col md:flex-row gap-6 md:gap-8">
        <aside id="year-nav" class="sticky top-16 z-10 flex md:flex-col gap-2 overflow-x-auto pb-2 md:pb-0 md:w-28 flex-shrink-0 bg-[#FDFBF7]/90 md:bg-transparent backdrop-blur-sm md:backdrop-blur-none">
          <span class="text-xs font-semibold uppercase text-stone-400 hidden md:block mb-1">탐색</span>
        </aside>

        <div id="posts-container" class="flex-1 space-y-8 md:space-y-10 border-l-2 border-amber-200/70 pl-4 md:pl-8 ml-2 md:ml-0"></div>
      </section>

      <!-- 2. 지도 여행 모드 뷰 -->
      <section id="map-view" class="hidden flex-col gap-4">
        <div class="relative w-full h-[540px] md:h-[600px] rounded-2xl overflow-hidden shadow-lg border border-stone-200 bg-stone-100 flex flex-col md:flex-row">
          <div id="leaflet-map" class="relative flex-1 h-full w-full"></div>
          <div id="map-preview-panel" class="w-full md:w-80 bg-white p-5 border-t md:border-t-0 md:border-l border-stone-200 flex flex-col justify-between hidden">
            <div>
              <div id="map-preview-date" class="text-xs text-amber-600 font-semibold mb-1"></div>
              <h3 id="map-preview-title" class="font-bold text-stone-900 text-lg leading-snug"></h3>
              <p id="map-preview-loc" class="text-xs text-stone-500 mt-1"></p>
              <div class="mt-3 relative aspect-video rounded-xl overflow-hidden bg-stone-100">
                <img id="map-preview-img" class="w-full h-full object-cover">
              </div>
              <p id="map-preview-desc" class="text-xs text-stone-600 mt-2 line-clamp-3 leading-relaxed"></p>
            </div>
            <button id="map-preview-btn" class="mt-4 w-full py-2.5 rounded-xl bg-stone-900 text-white text-xs font-semibold hover:bg-amber-600 transition shadow-sm active:scale-95">
              넷플릭스 모드로 감상하기 →
            </button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- 3. 넷플릭스/OTT 상세 뷰어 -->
  <div id="netflix-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/95 p-0 md:p-6 backdrop-blur-md hidden animate-fadeIn">
    <button onclick="closeNetflixModal()" class="absolute top-4 right-4 z-50 flex h-11 w-11 items-center justify-center rounded-full bg-white/20 text-white hover:bg-white/30 transition active:scale-90">
      <i data-lucide="x" class="w-6 h-6"></i>
    </button>

    <div class="relative h-full w-full max-w-5xl overflow-y-auto bg-[#141414] text-white rounded-none md:rounded-3xl shadow-2xl flex flex-col">
      <!-- 상단 메인 시네마틱 뷰어 (모바일에서 더 큼직하게 45vh 이상 확보) -->
      <div class="relative w-full h-[45vh] md:h-[58vh] bg-black flex items-center justify-center overflow-hidden">
        <div id="modal-player-wrap" class="w-full h-full flex items-center justify-center cursor-zoom-in"></div>
        <div class="absolute bottom-2 right-3 pointer-events-none bg-black/50 backdrop-blur-sm px-2.5 py-1 rounded-full text-[11px] text-stone-300 flex items-center gap-1">
          <i data-lucide="maximize-2" class="w-3.5 h-3.5"></i>
          <span>터치 시 전체화면 확대</span>
        </div>
      </div>

      <!-- 콘텐츠 상세 설명 & 하단 와이드 가로 슬라이더 -->
      <div class="p-5 md:p-8 space-y-5 flex-1 bg-[#141414]">
        <div>
          <div id="modal-meta" class="flex items-center gap-2 text-xs font-bold tracking-wider text-amber-400 uppercase"></div>
          <h2 id="modal-title" class="text-xl md:text-3xl font-extrabold mt-1 text-white"></h2>
          <p id="modal-desc" class="mt-2 text-stone-300 text-xs md:text-sm leading-relaxed max-w-3xl"></p>
        </div>

        <div class="pt-2">
          <h4 id="modal-slider-count" class="text-xs md:text-sm font-bold text-stone-400 mb-3">모아보기</h4>
          <div id="modal-thumbnails" class="flex gap-3 md:gap-4 overflow-x-auto pb-4 slider-touch"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 4. 전체화면 핀치 줌 / 딥 뷰어 (상단 사진 터치 시 실행) -->
  <div id="fullscreen-lightbox" class="fixed inset-0 z-50 bg-black flex flex-col justify-between hidden">
    <!-- 상단 툴바 -->
    <div class="flex items-center justify-between p-4 bg-gradient-to-b from-black/80 to-transparent z-10">
      <span id="lightbox-counter" class="text-xs font-medium text-stone-300"></span>
      <div class="flex items-center gap-2">
        <button onclick="zoomReset()" class="p-2 rounded-full bg-white/10 text-white hover:bg-white/20 text-xs px-3">100%</button>
        <button onclick="closeLightbox()" class="p-2 rounded-full bg-white/20 text-white hover:bg-white/30">
          <i data-lucide="x" class="w-6 h-6"></i>
        </button>
      </div>
    </div>

    <!-- 중앙 인터랙티브 줌 이미지 영역 -->
    <div id="lightbox-viewport" class="relative flex-1 flex items-center justify-center overflow-hidden touch-pan">
      <img id="lightbox-img" class="max-w-full max-h-full object-contain transition-transform duration-100 ease-out select-none" style="transform-origin: center center;" />
    </div>

    <!-- 하단 안내 -->
    <div class="p-3 text-center text-[11px] text-stone-400 bg-gradient-to-t from-black/80 to-transparent">
      두 손가락으로 확대/축소하거나 더블 탭하세요
    </div>
  </div>

  <script>
    const FAMILY_PIN = "1216";

    let activePost = null;
    let currentMedia = null;
    let leafletMap = null;
    let markersLayer = null;

    // 핀치 줌 관련 변수
    let scale = 1;
    let lastDistance = null;

    function verifyPin(e) {
      e.preventDefault();
      const val = document.getElementById('pin-input').value;
      if (val === FAMILY_PIN) {
        sessionStorage.setItem('family_auth', 'true');
        unlockSite();
      } else {
        document.getElementById('pin-error').classList.remove('hidden');
      }
    }

    function unlockSite() {
      document.getElementById('pin-screen').classList.add('hidden');
      document.getElementById('main-app').classList.remove('hidden');
      initPage();
    }

    function checkAuth() {
      if (sessionStorage.getItem('family_auth') === 'true') {
        unlockSite();
      } else {
        lucide.createIcons();
      }
    }

    function initPage() {
      if (typeof memoriesData === 'undefined' || !memoriesData || memoriesData.length === 0) {
        alert("data.js 데이터를 찾을 수 없습니다.");
        return;
      }
      renderTimeline();
      initMap();
      setupZoomTouch();
      lucide.createIcons();
    }

    function renderTimeline() {
      const postsContainer = document.getElementById('posts-container');
      const yearNav = document.getElementById('year-nav');
      postsContainer.innerHTML = '';
      yearNav.innerHTML = '<span class="text-xs font-semibold uppercase text-stone-400 hidden md:block mb-1">탐색</span>';

      const categories = [...new Set(memoriesData.map(m => m.year))];

      categories.forEach(cat => {
        const a = document.createElement('a');
        a.href = `#sec-${cat}`;
        a.className = "rounded-lg px-3 py-1.5 text-center text-xs font-medium text-stone-600 bg-stone-100 hover:bg-stone-200 transition whitespace-nowrap";
        a.innerText = typeof cat === 'number' ? `${cat}년` : cat;
        yearNav.appendChild(a);
      });

      memoriesData.forEach(post => {
        const card = document.createElement('article');
        card.id = `sec-${post.year}`;
        card.className = "group relative cursor-pointer rounded-2xl bg-white p-4 md:p-6 shadow-sm ring-1 ring-stone-900/5 transition hover:shadow-md hover:-translate-y-0.5 active:scale-[0.99]";
        card.onclick = () => openNetflixModal(post);

        const isVideo = post.coverMedia && post.coverMedia.type === 'video';

        card.innerHTML = `
          <div class="absolute -left-[25px] md:-left-[41px] top-6 h-4 w-4 rounded-full border-4 border-[#FDFBF7] bg-amber-500 shadow-sm"></div>
          <div class="flex flex-wrap items-center gap-2 md:gap-3 text-xs text-stone-500 mb-2">
            <span class="bg-amber-50 text-amber-800 px-2 py-0.5 rounded-full font-medium flex items-center gap-1">
              <i data-lucide="calendar" class="w-3.5 h-3.5"></i> ${post.date}
            </span>
            <span class="flex items-center gap-1">
              <i data-lucide="map-pin" class="w-3.5 h-3.5 text-stone-400"></i> ${post.location.name}
            </span>
          </div>
          <h3 class="text-lg md:text-xl font-bold text-stone-900 group-hover:text-amber-600 transition">${post.title}</h3>
          <p class="mt-1 text-xs md:text-sm text-stone-600 line-clamp-2">${post.description}</p>
          <div class="relative mt-3 md:mt-4 aspect-video md:aspect-[21/9] w-full overflow-hidden rounded-xl bg-stone-100">
            <img src="${post.coverMedia.thumbnailUrl}" class="h-full w-full object-cover transition duration-300 group-hover:scale-105" loading="lazy">
            ${isVideo ? `
              <div class="absolute inset-0 flex items-center justify-center bg-black/25">
                <div class="flex h-12 w-12 items-center justify-center rounded-full bg-white/90 text-stone-900 shadow-lg">
                  <i data-lucide="play" class="w-5 h-5 fill-current ml-0.5"></i>
                </div>
              </div>` : ''}
          </div>
          <div class="mt-3 flex items-center justify-between text-xs text-stone-400">
            <span>미디어 ${post.mediaList.length}개</span>
            <span class="font-semibold text-amber-700 group-hover:underline">넷플릭스 모드로 감상하기 →</span>
          </div>
        `;
        postsContainer.appendChild(card);
      });
    }

    function openNetflixModal(post) {
      activePost = post;
      const metaText = typeof post.year === 'number' 
        ? `${post.year}년 • ${post.location.name}` 
        : `${post.location.name}`;
      
      document.getElementById('modal-meta').innerText = metaText;
      document.getElementById('modal-title').innerText = post.title;
      document.getElementById('modal-desc').innerText = post.description;
      document.getElementById('modal-slider-count').innerText = `모아보기 (${post.mediaList.length})`;

      renderActiveMedia(post.coverMedia);

      const thumbContainer = document.getElementById('modal-thumbnails');
      thumbContainer.innerHTML = '';

      post.mediaList.forEach(m => {
        const item = document.createElement('div');
        item.className = "relative flex-shrink-0 cursor-pointer overflow-hidden rounded-xl transition transform duration-200 hover:scale-105 active:scale-95 ring-1 ring-white/10 shadow-lg";
        item.style.width = "170px";
        item.style.height = "105px";
        item.onclick = (e) => { e.stopPropagation(); renderActiveMedia(m); };
        item.innerHTML = `
          <img src="${m.thumbnailUrl}" class="w-full h-full object-cover" loading="lazy">
          <div class="absolute bottom-1.5 right-1.5 rounded-md bg-black/70 p-1 text-white text-[10px]">
            ${m.type === 'video' ? '<i data-lucide="play" class="w-3.5 h-3.5 fill-current"></i>' : '<i data-lucide="image" class="w-3.5 h-3.5"></i>'}
          </div>
        `;
        thumbContainer.appendChild(item);
      });

      document.getElementById('netflix-modal').classList.remove('hidden');
      lucide.createIcons();
    }

    function renderActiveMedia(media) {
      currentMedia = media;
      const wrap = document.getElementById('modal-player-wrap');
      if (media.type === 'video') {
        wrap.onclick = null;
        wrap.innerHTML = `<iframe src="${media.url}" class="w-full h-full border-0" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;
      } else {
        wrap.onclick = () => openLightbox(media);
        wrap.innerHTML = `<img src="${media.url}" class="max-h-full max-w-full object-contain pointer-events-none">`;
      }
    }

    function closeNetflixModal() {
      document.getElementById('netflix-modal').classList.add('hidden');
      document.getElementById('modal-player-wrap').innerHTML = '';
    }

    // 4. 전체화면 핀치 줌 라이트박스 로직
    function openLightbox(media) {
      if (!media || media.type === 'video') return;
      scale = 1;
      const lb = document.getElementById('fullscreen-lightbox');
      const img = document.getElementById('lightbox-img');
      img.src = media.url;
      img.style.transform = `scale(1)`;
      document.getElementById('lightbox-counter').innerText = media.name || '가족 사진';
      lb.classList.remove('hidden');
      lucide.createIcons();
    }

    function closeLightbox() {
      document.getElementById('fullscreen-lightbox').classList.add('hidden');
      scale = 1;
    }

    function zoomReset() {
      scale = 1;
      document.getElementById('lightbox-img').style.transform = `scale(1)`;
    }

    function setupZoomTouch() {
      const viewport = document.getElementById('lightbox-viewport');
      const img = document.getElementById('lightbox-img');

      // 더블 탭 확대
      let lastTap = 0;
      viewport.addEventListener('touchend', (e) => {
        const currentTime = new Date().getTime();
        const tapLength = currentTime - lastTap;
        if (tapLength < 300 && tapLength > 0) {
          scale = scale > 1 ? 1 : 2.2;
          img.style.transform = `scale(${scale})`;
          e.preventDefault();
        }
        lastTap = currentTime;
      });

      // 멀티 터치 핀치 줌
      viewport.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2) {
          const dist = Math.hypot(
            e.touches[0].pageX - e.touches[1].pageX,
            e.touches[0].pageY - e.touches[1].pageY
          );
          if (lastDistance) {
            const diff = dist - lastDistance;
            scale = Math.min(Math.max(1, scale + diff * 0.008), 4);
            img.style.transform = `scale(${scale})`;
          }
          lastDistance = dist;
        }
      });

      viewport.addEventListener('touchend', () => { lastDistance = null; });
    }

    function switchView(mode) {
      const btnT = document.getElementById('btn-timeline');
      const btnM = document.getElementById('btn-map');
      const viewT = document.getElementById('timeline-view');
      const viewM = document.getElementById('map-view');

      if (mode === 'timeline') {
        btnT.className = "flex items-center gap-1.5 rounded-full px-3.5 py-1.5 bg-white text-stone-900 shadow-sm transition";
        btnM.className = "flex items-center gap-1.5 rounded-full px-3.5 py-1.5 text-stone-600 hover:text-stone-900 transition";
        viewT.classList.remove('hidden');
        viewM.classList.add('hidden');
      } else {
        btnM.className = "flex items-center gap-1.5 rounded-full px-3.5 py-1.5 bg-white text-stone-900 shadow-sm transition";
        btnT.className = "flex items-center gap-1.5 rounded-full px-3.5 py-1.5 text-stone-600 hover:text-stone-900 transition";
        viewM.classList.remove('hidden');
        viewT.classList.add('hidden');
        setTimeout(() => leafletMap.invalidateSize(), 200);
      }
    }

    function initMap() {
      leafletMap = L.map('leaflet-map').setView([18.0, 115.0], 4);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
      }).addTo(leafletMap);

      markersLayer = L.layerGroup().addTo(leafletMap);

      memoriesData.forEach(post => {
        const customIcon = L.divIcon({
          className: 'custom-pin',
          html: `<div style="width:40px;height:40px;border-radius:50%;border:2px solid #d97706;box-shadow:0 2px 8px rgba(0,0,0,0.3);overflow:hidden;background:#000;">
                  <img src="${post.coverMedia.thumbnailUrl}" style="width:100%;height:100%;object-fit:cover;">
                 </div>`,
          iconSize: [40, 40]
        });

        const marker = L.marker([post.location.lat, post.location.lng], { icon: customIcon });
        marker.on('click', () => showMapPreview(post));
        markersLayer.addLayer(marker);
      });
    }

    function showMapPreview(post) {
      const p = document.getElementById('map-preview-panel');
      p.classList.remove('hidden');
      document.getElementById('map-preview-date').innerText = post.date;
      document.getElementById('map-preview-title').innerText = post.title;
      document.getElementById('map-preview-loc').innerText = `📍 ${post.location.name}`;
      document.getElementById('map-preview-img').src = post.coverMedia.thumbnailUrl;
      document.getElementById('map-preview-desc').innerText = post.description;
      document.getElementById('map-preview-btn').onclick = () => openNetflixModal(post);
    }

    window.onload = checkAuth;
  </script>
</body>
</html>
